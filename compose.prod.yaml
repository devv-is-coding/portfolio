# Production images, run locally or in CI's smoke test:
#   docker compose -f compose.prod.yaml up --build
# For development use compose.yaml (`docker compose up --watch`).
# Real deployments must set DB_PASSWORD / DB_ROOT_PASSWORD (the defaults are for local use only).
name: portfolio-prod

x-backend-env: &backend-env
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-portfolio}
  DB_USER: ${DB_USER:-portfolio}
  DB_PASSWORD: ${DB_PASSWORD:-portfolio}
  REDIS_URL: redis://redis:6379/0

services:
  mariadb:
    image: mariadb:11.8
    # Small-server memory: the data is a few MB, every table is InnoDB (the MyISAM key
    # buffer only needs a little), so the default 128 MB caches are mostly unused.
    command: ["--innodb-buffer-pool-size=64M", "--key-buffer-size=8M", "--innodb-log-buffer-size=8M"]
    environment:
      MARIADB_DATABASE: ${DB_NAME:-portfolio}
      MARIADB_USER: ${DB_USER:-portfolio}
      MARIADB_PASSWORD: ${DB_PASSWORD:-portfolio}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: ./backend
    # One process, with the beat scheduler embedded (--beat): fine for a single worker; a
    # second worker would need beat in its own service, or scheduled tasks run twice.
    command: ["celery", "-A", "app.worker", "worker", "--pool=threads", "--beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker answers a ping, and beat rewrote its schedule files (SQLite, -wal/-shm)
      # within 15 minutes (it does so every 5 while it runs).
      test: ["CMD-SHELL", "celery -A app.worker inspect ping --timeout 5 && python -c \"import glob, os, sys, time; sys.exit(time.time() - max(map(os.path.getmtime, glob.glob('/tmp/celerybeat-schedule*'))) > 900)\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle at build time; must be reachable from the browser.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      # Server-side code -> backend (Docker network name). Read at runtime.
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mariadb-data:
