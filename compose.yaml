# Local development stack: MariaDB + Redis + `fastapi dev` + Celery worker + `next dev`.
#   docker compose up --watch
# Source is NOT bind-mounted (slow on Windows). Watch syncs host edits into the
# containers one way (host -> container), and rebuilds the image when dependency
# files change. `migrate` applies Alembic migrations once on every `up`.
# Production images: see compose.prod.yaml.
name: portfolio

x-backend-env: &backend-env
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-portfolio}
  DB_USER: ${DB_USER:-portfolio}
  DB_PASSWORD: ${DB_PASSWORD:-portfolio}
  REDIS_URL: redis://redis:6379/0

services:
  mariadb:
    image: mariadb:11.8
    ports:
      # Host port 3307, so it doesn't clash with another MySQL/MariaDB on 3306.
      - "3307:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME:-portfolio}
      MARIADB_USER: ${DB_USER:-portfolio}
      MARIADB_PASSWORD: ${DB_PASSWORD:-portfolio}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    ports:
      # Host port 6380, so it doesn't clash with another Redis on 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    # Read-only mounts so the latest migrations and models from the host are applied,
    # not the copy baked into the image. (One-shot job, so bind-mount speed doesn't matter.)
    volumes:
      - ./backend/alembic:/app/alembic:ro
      - ./backend/app:/app/app:ro
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  worker:
    build:
      context: ./backend
      target: dev
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 15s
    develop:
      watch:
        # Celery doesn't auto-reload: sync the code, then restart the worker.
        - action: sync+restart
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  # The scheduler (Celery beat): sends scheduled tasks to the worker. Run exactly one.
  beat:
    build:
      context: ./backend
      target: dev
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Beat rewrites its schedule files (SQLite, with -wal/-shm) every few minutes while it runs.
      test: ["CMD", "python", "-c", "import glob, os, sys, time; sys.exit(time.time() - max(map(os.path.getmtime, glob.glob('/tmp/celerybeat-schedule*'))) > 900)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      # Browser -> backend (your machine's port).
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side code -> backend (Docker network name).
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  mariadb-data:
