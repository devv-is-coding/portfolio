name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # `edited` re-runs CI when the PR title changes (commitlint checks it).
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every push and pull request runs ALL jobs: frontend, backend and commit messages.
jobs:
  frontend:
    name: Frontend (conventions, lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Check file & code conventions
        run: npm run check:conventions

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    # Keep this name: it's a required status check in the GitHub ruleset.
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Same image and host port (3307) as compose.yaml, so the app's default DB_* settings work.
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: portfolio
          MARIADB_USER: portfolio
          MARIADB_PASSWORD: portfolio
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app tests alembic

      - name: Test
        run: uv run pytest

      - name: Migrations apply (alembic upgrade head)
        run: uv run alembic upgrade head

      - name: Models match migrations (alembic check)
        run: uv run alembic check

      - name: Migrations roll back and re-apply
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  docker:
    name: Docker (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build the dev stages straight from the Dockerfiles. compose.yaml uses
      # `develop.watch[].initial_sync`, which the runner's older Docker Compose rejects.
      - name: Build dev images (Dockerfile `dev` targets)
        run: |
          docker build --target dev ./frontend
          docker build --target dev ./backend

      - name: Build production images (compose.prod.yaml)
        run: docker compose -f compose.prod.yaml build

      - name: Start production stack and wait for health checks
        run: docker compose -f compose.prod.yaml up -d --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:3000

      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.prod.yaml logs

      - name: Stop stack
        if: always()
        run: docker compose -f compose.prod.yaml down

  branch:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Branch rules: .ai/rules/github.md. Branch and commit prefixes differ:
      # branch `feature/tenant-management`, commit `feat: implement tenant management`.
      - name: Check branch name matches <type>/<short-description>
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feature|fix|hotfix|refactor|docs|test|chore|style|perf)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "Branch name OK: $BRANCH"
          else
            echo "::error title=Branch name::'$BRANCH' must be <type>/<short-description> or <type>/<issue-number>-<short-description> (lowercase, hyphens), e.g. feature/42-tenant-directory or fix/nav-overflow. Types: feature, fix, hotfix, refactor, docs, test, chore, style, perf. See .ai/rules/github.md."
            exit 1
          fi

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose

      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$FROM" --to "$TO" --verbose

      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          FROM: ${{ github.event.before }}
          TO: ${{ github.event.after }}
        run: |
          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$FROM" --to "$TO" --verbose
          fi
